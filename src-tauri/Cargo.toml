[package]
name = "sshbook"
version = "1.0.7"
description = "SSHBook — SSH / 로컬 터미널"
edition = "2021"

[lib]
name = "sshbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# 앱 안에서 GitHub 릴리스로 업데이트하고 다시 시작한다.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# 보관함 암호화. API가 안정된 버전으로 고정한다.
argon2 = "0.5"
aes-gcm = "0.10"
getrandom = "0.2"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
# 로컬 셸 (Windows는 ConPTY, macOS는 openpty)
portable-pty = "0.9"
# 터미널 안 프로그램이 보낸 복사(OSC 52)를 클립보드에 넣는다. 그림 복사는 쓰지 않는다.
arboard = { version = "3", default-features = false }
# 글꼴 내려받기·확인·압축 풀기. 앱 업데이트(tauri-plugin-updater)와 같은 설정을 써서 새로 빌드할 것이 거의 없다.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
uuid = { version = "1", features = ["v4"] }
# SSH 클라이언트. aws-lc-rs는 Windows에서 NASM이 필요해서 ring 백엔드를 쓴다.
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "time", "net", "io-util"] }
# 원격 폴더 보기·파일 주고받기
# (russh-sftp는 위 russh와 상관없이 채널 스트림 위에서 돈다)
russh-sftp = "3.0.1"
# 세션 기록 파일의 시각
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

# 설치한 글꼴을 바로 불러오고 다른 프로그램에 알린다.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
