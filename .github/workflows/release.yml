# 설치 파일 빌드 + GitHub Releases에 올리기
#
# 쓰는 법: 버전 태그를 올리면 Windows·macOS 설치 파일을 만들어 릴리스에 붙인다.
#   git tag v0.1.0 && git push origin v0.1.0
# 태그 버전은 tauri.conf.json의 version과 같아야 한다(앱 안 업데이트가 이 번호로 새 버전을 알아본다).
#
# 앱 안 업데이트: 설치 파일과 함께 서명(.sig)과 latest.json을 릴리스에 올린다.
# 저장소 Secrets에 TAURI_SIGNING_PRIVATE_KEY(개인 키 파일 내용)와
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD(키 암호)가 있어야 한다.
# Actions 탭에서 "Run workflow"로 직접 돌릴 수도 있다(이때는 지금 버전으로 릴리스를 만든다).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1) 릴리스를 초안으로 만든다. 초안은 'latest'로 잡히지 않으므로
  #    빌드가 다 끝나기 전에는 앱이 새 버전을 보지 않는다(반쯤 올라간 latest.json 방지).
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v$VERSION"
          # 릴리스 본문 = CHANGELOG.md의 "## <버전>" 부분 + 내려받기 안내. 앱 안 업데이트 알림에도 쓰인다.
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "- 바뀐 점은 CHANGELOG.md를 보세요." > notes.md
          cat >> notes.md <<'NOTES'

          ## 내려받기
          - **Windows**: `SSHBook_x.y.z_x64-setup.exe`(설치 프로그램) 또는 `.msi`
          - **macOS** (Intel·Apple Silicon 공용): `SSHBook_x.y.z_universal.dmg`

          서명하지 않은 빌드라서 처음 실행할 때 경고가 뜹니다. README의 "설치" 부분을 참고하세요.
          이미 설치했다면 앱의 업데이트 알림이나 설정 → 업데이트 확인으로 바로 업데이트할 수 있습니다.
          NOTES
          # 앱 안 업데이트 알림(latest.json의 notes)에도 같은 내용을 넘긴다(내려받기 안내는 뺀다).
          { echo "notes<<SSHBOOK_NOTES"; sed '/^## 내려받기/,$d' notes.md; echo "SSHBOOK_NOTES"; } >> "$GITHUB_OUTPUT"
          # 다시 돌릴 때는 이미 있는 릴리스(초안 포함)를 쓴다.
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | sed -n 1p)
          if [ -z "$ID" ]; then
            # 만든 응답에서 바로 id를 받는다(막 만든 초안은 목록에 늦게 보일 수 있다).
            ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="SSHBook $TAG" \
              -F draft=true -F body=@notes.md --jq .id)
          fi
          # id가 비면 여기서 멈춘다(빈 id로 빌드·공개가 이어지지 않게).
          if [ -z "$ID" ]; then echo "릴리스 id를 얻지 못했습니다"; exit 1; fi
          echo "릴리스 id: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  # 2) OS마다 빌드해서 초안 릴리스에 붙인다.
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_targets: ""
          # Intel·Apple Silicon 둘 다 도는 하나의 앱(universal)
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # latest.json의 notes(앱 안 업데이트 카드에 보이는 바뀐 점)
          releaseBody: ${{ needs.create-release.outputs.notes }}
          args: ${{ matrix.args }}
          # latest.json의 Windows 항목은 .msi 대신 setup.exe(NSIS)로
          updaterJsonPreferNsis: true

  # 3) 모든 OS 빌드가 성공했을 때만 공개한다. 이때부터 앱이 새 버전을 본다.
  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.create-release.outputs.id }}" -F draft=false -f make_latest=true
